root = "."
testdata_dir = "testdata"
tmp_dir = ".tmp"

[build]
args_bin = []
bin = "./.tmp/main"
cmd = "npm run dev && templ generate && go build -v -o ./.tmp/main ./cmd/web"
delay = 1000
exclude_dir = [".tmp", "public", "testdata", "node_modules"]
exclude_file = []
exclude_regex = ["_test.go", "_templ.go"]
exclude_unchanged = false
follow_symlink = false
full_bin = ""
include_dir = []
include_ext = ["go", "ts", "templ"]
kill_delay = "0s"
log = "build-errors.log"
send_interrupt = false
stop_on_error = true

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
time = false

[misc]
clean_on_exit = false

[screen]
clear_on_rebuild = false
